name = "tg-lottery-bot"
main = "src/index.js"
compatibility_date = "2025-07-01"
compatibility_flags = ["nodejs_compat"]

# 在 Cloudflare Dashboard 手动创建 KV Namespace，
# 然后把它的 ID 填到下面两处（正式 + 预览用同一个即可）
[[kv_namespaces]]
binding = "LOTTERY_KV"
id = "REPLACE_KV_ID"
preview_id = "REPLACE_PREVIEW_ID"

# 定时开奖检查（每分钟）
[triggers]
crons = ["* * * * *"]